name: deploy
# Builds the app and publishes it to GitHub Pages. The app contains no personal data.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Gates before anything is published: the tests (incl. the privacy scan of the app files and of dist; it needs the
      # private term list in the optional HQ_PRIVACY_TERMS secret and skips with a note without it) and the size budget.
      - run: npm test
        env:
          HQ_PRIVACY_TERMS: ${{ secrets.HQ_PRIVACY_TERMS }}
      - run: npm run budget
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
