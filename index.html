<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <!-- Defence in depth for rendered notes, posts and AI answers (lib/md-html.ts is the first layer): images only from
         the app, data: URIs, blob: URLs (repo images the Docs reader read through the Source) and GitHub avatars; no form
         posts; no <base>; no plugins. Scripts/styles are not restricted here (the inline pre-paint script and the dev
         server's inline scripts must run). -->
    <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob: https://avatars.githubusercontent.com; form-action 'none'; base-uri 'none'; object-src 'none'" />
    <title>Pinwheel</title>
    <!-- favicon: the small-size Pinwheel cut (6 bigger blades, full-bleed on the violet tile) so it still reads at 16px -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='27' fill='%235533fc'/><path fill='%23ff9a5e' d='M60 60Q39.5 40.1 60.0 8.0A52 52 0 0 1 90.6 17.9Q56.3 38.5 60 60ZM60 60Q67.0 32.3 105.0 34.0A52 52 0 0 1 111.7 65.4Q76.8 46.0 60 60ZM60 60Q87.5 52.2 105.0 86.0A52 52 0 0 1 81.2 107.5Q80.5 67.5 60 60ZM60 60Q80.5 79.9 60.0 112.0A52 52 0 0 1 29.4 102.1Q63.7 81.5 60 60ZM60 60Q53.0 87.7 15.0 86.0A52 52 0 0 1 8.3 54.6Q43.2 74.0 60 60ZM60 60Q32.5 67.8 15.0 34.0A52 52 0 0 1 38.8 12.5Q39.5 52.5 60 60Z'/></svg>" />
    <meta name="theme-color" content="#f6f3ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141318" media="(prefers-color-scheme: dark)" />
    <script>
      /* Pre-paint (runs before any CSS or React): read the enum-only look cache (hq.ui.<login>, login from hq.ui.@last),
         keep only values from the enum lists below (anything else = default), resolve 'system', and set the data-*
         attributes the CSS matches on. No flash of the wrong theme, no text-size jump. Migrates the v2 'hq.theme' once
         and drops 'hq.design'. The enum lists are plain JSON between the markers (E's prepaint-parity test reads them). */
      (function () {
        var r = document.documentElement
        try {
          var E = /*HQ_ENUM*/{"theme":["system","light","dark"],"accent":["violet","blue","green","amber","rose","slate"],"density":["compact","comfy","spacious"],"size":["s","m","l","xl","xxl"],"font":["inter","lexend","atkinson","system"],"lh":["normal","relaxed","loose"],"ls":["normal","wide"],"motion":["system","reduced","full"],"contrast":["normal","high"],"calm":["off","on"],"focus":["off","on"],"keys":["on","off"]}/*HQ_ENUM_END*/
          var D = { theme: 'system', accent: 'violet', density: 'comfy', size: 'm', font: 'inter', lh: 'normal', ls: 'normal', motion: 'system', contrast: 'normal', calm: 'off', focus: 'off', keys: 'on' }
          var S = window.localStorage
          var J = function (k) { try { var v = S.getItem(k); return v == null ? null : JSON.parse(v) } catch (e) { return null } }
          var who = J('hq.ui.@last')
          if (typeof who !== 'string' || !/^[\w@.-]{1,40}$/.test(who)) who = '@local'
          var key = 'hq.ui.' + who.toLowerCase()
          var c = J(key)
          if (!c || typeof c !== 'object' || Array.isArray(c)) c = {}
          var old = J('hq.theme')
          if (old != null) {
            if (!c.theme && (old === 'light' || old === 'dark')) {
              c.theme = old
              try { S.setItem(key, JSON.stringify(c)); S.setItem('hq.ui.@last', JSON.stringify(who)) } catch (e) {}
            }
            try { S.removeItem('hq.theme') } catch (e) {}
          }
          try { S.removeItem('hq.design') } catch (e) {}
          var p = {}
          for (var k in E) { var v = c[k]; p[k] = typeof v === 'string' && E[k].indexOf(v) >= 0 ? v : D[k] }
          var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null
          r.setAttribute('data-theme', p.theme === 'dark' || (p.theme === 'system' && !!(mq && mq.matches)) ? 'dark' : 'light')
          r.setAttribute('data-theme-pref', p.theme)
          var A = ['accent', 'density', 'size', 'font', 'lh', 'ls', 'contrast', 'calm', 'focus']
          for (var i = 0; i < A.length; i++) if (p[A[i]] !== D[A[i]]) r.setAttribute('data-' + A[i], p[A[i]])
          if (p.motion !== 'system') r.setAttribute('data-motion', p.motion)
          if (p.focus === 'on' || J('hq.sb.rail') === true) r.setAttribute('data-sb', 'rail')
          var F = { lexend: 'Lexend:wght@400..700', atkinson: 'Atkinson+Hyperlegible+Next:wght@200..800' }
          if (F[p.font]) {
            var l = document.createElement('link')
            l.id = 'font-' + p.font
            l.rel = 'stylesheet'
            l.href = 'https://fonts.googleapis.com/css2?family=' + F[p.font] + '&display=swap'
            document.head.appendChild(l)
          }
          if (mq && mq.addEventListener)
            mq.addEventListener('change', function (e) { if (r.getAttribute('data-theme-pref') === 'system') r.setAttribute('data-theme', e.matches ? 'dark' : 'light') })
        } catch (e) {
          r.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..800&family=JetBrains+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
